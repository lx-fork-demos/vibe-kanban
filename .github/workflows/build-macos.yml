name: Build macOS Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend Web App
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build local-web
        run: |
          export VK_SHARED_API_BASE="https://api.vibekanban.com"
          export VITE_VK_SHARED_API_BASE="https://api.vibekanban.com"
          cd packages/local-web && pnpm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/local-web/dist/
          retention-days: 1

  build-desktop:
    name: Build macOS Tauri App
    needs: build-frontend
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-04

      - name: Install tauri-cli
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: tauri-cli@2

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/local-web/dist

      - name: Prepare Tauri Config
        run: |
          TAURI_CONF="crates/tauri-app/tauri.conf.json"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('$TAURI_CONF', 'utf8'));
            if (conf.bundle) {
              conf.bundle.createUpdaterArtifacts = false;
            }
            if (conf.plugins && conf.plugins.updater) {
              delete conf.plugins.updater.pubkey;
              conf.plugins.updater.endpoints = ['https://localhost/disabled'];
            }
            fs.writeFileSync('$TAURI_CONF', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Build Tauri Desktop App
        run: |
          if [ -f "crates/tauri-app/tauri.conf.json" ]; then
            (cd crates/tauri-app && cargo tauri build) || cargo tauri build --config crates/tauri-app/tauri.conf.json
          else
            cargo tauri build
          fi

      - name: Upload macOS App & DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Kanban-macOS-Desktop
          path: |
            target/release/bundle/macos
            target/release/bundle/dmg/*.dmg
            crates/tauri-app/target/release/bundle/macos
            crates/tauri-app/target/release/bundle/dmg/*.dmg
